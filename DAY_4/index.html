<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Post Management System</title>

    <!-- <link rel="icon" href="OIP.png"> -->
    <link rel="stylesheet" href="style.css">

</head>

<body>

    <div class="container">

        <h1>Post Management System</h1>

        <!-- =========================
             Top Bar
        ========================== -->

        <div class="top-bar">

            <input
                type="text"
                id="search"
                placeholder="Search Post..."
            >

            <div class="top-buttons">

                <select id="filterUser">

                    <option value="All">
                        All Users
                    </option>

                    <option value="1">User 1</option>
                    <option value="2">User 2</option>
                    <option value="3">User 3</option>
                    <option value="4">User 4</option>
                    <option value="5">User 5</option>
                    <option value="6">User 6</option>
                    <option value="7">User 7</option>
                    <option value="8">User 8</option>
                    <option value="9">User 9</option>
                    <option value="10">User 10</option>

                </select>

                <button id="sortBtn">
                    Sort A-Z
                </button>

                <button id="openAddModal">
                    + Add Post
                </button>

            </div>

        </div>

        <!-- =========================
             Statistics
        ========================== -->

        <div class="stats">

            <p>
                Total Posts :
                <span id="totalPosts">0</span>
            </p>

            <p>
                Total Users :
                <span id="totalUsers">0</span>
            </p>

        </div>

        <!-- =========================
             Table
        ========================== -->

        <div class="table-box">

            <table class="student-table">

                <thead>

                    <tr>

                        <th>ID</th>
                        <th>User ID</th>
                        <th>Title</th>
                        <th>Description</th>
                        <th>Action</th>

                    </tr>

                </thead>

                <tbody id="postTableBody">

                </tbody>

            </table>

        </div>

    </div>

    <!-- =========================
         Add / Edit Post Modal
    ========================== -->

    <div id="addModal"
         class="modal">

        <div class="modal-content">

            <span id="closeAddModal">
                &times;
            </span>

            <h2 id="modalTitle">
                Add Post
            </h2>

            <input
                type="number"
                id="userId"
                placeholder="User ID (1 - 10)"
                min="1"
                max="10"
            >

            <input
                type="text"
                id="title"
                placeholder="Post Title"
            >

            <textarea
                id="body"
                placeholder="Post Description"
            ></textarea>

            <div class="confirm-buttons">

                <button id="saveBtn">
                    Save Post
                </button>

                <button id="cancelAddBtn">
                    Cancel
                </button>

            </div>

        </div>

    </div>

    <!-- =========================
         Post Details Modal
    ========================== -->

    <div id="detailsModal"
         class="modal">

        <div class="modal-content">

            <span id="closeModal">
                &times;
            </span>

            <h2>
                Post Details
            </h2>

            <div id="detailsText">

            </div>

        </div>

    </div>

    <!-- =========================
         Action Modal
    ========================== -->

    <div id="actionModal"
         class="modal">

        <div class="modal-content action-modal">

            <span id="closeActionModal">
                &times;
            </span>

            <h2>
                Post Actions
            </h2>

            <button id="editBtn">
                Edit Post
            </button>

            <button id="deleteBtn">
                Delete Post
            </button>

            <button id="viewBtn">
                View Details
            </button>

        </div>

    </div>

    <script src="script.js"></script>

</body>

</html>
